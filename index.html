
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Downloads</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --primary:#3b82f6;
    --primary-hover:#2563eb;
    --text:#f8fafc;
    --muted:#94a3b8;
    --success:#22c55e;
    --radius:20px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(180deg,#020617,#0f172a);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
}

.hero{
    text-align:center;
    padding:30px 10px;
}

.logo{
    width:90px;
    height:90px;
    border-radius:24px;
    margin:auto;
    background:linear-gradient(135deg,#3b82f6,#06b6d4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:700;
}

.hero h1{
    margin-top:18px;
    font-size:28px;
}

.hero p{
    margin-top:10px;
    color:var(--muted);
    line-height:1.5;
}

.card{
    background:rgba(30,41,59,.9);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
}

.release-version{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.badge{
    background:rgba(34,197,94,.15);
    color:var(--success);
    padding:6px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
}

.info{
    color:var(--muted);
    font-size:14px;
    margin-bottom:15px;
}

.download-btn{
    width:100%;
    border:none;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    background:var(--primary);
    color:white;
    padding:16px;
    border-radius:14px;
    font-weight:600;
    transition:.2s;
}

.download-btn:hover{
    background:var(--primary-hover);
}

.asset-list{
    margin-top:15px;
}

.asset{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    border-radius:12px;
    background:#0f172a;
    margin-bottom:10px;
}

.asset a{
    color:#60a5fa;
    text-decoration:none;
    font-size:14px;
}

.loader{
    text-align:center;
    padding:25px;
    color:var(--muted);
}

@media (max-width:480px){
    .hero h1{
        font-size:24px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="hero">
        <div class="logo">A</div>
        <h1>Download Latest Version</h1>
        <p>Always get the newest release directly from GitHub.</p>
    </div>

    <div class="card">

        <div id="loading" class="loader">
            Loading latest release...
        </div>

        <div id="releaseData" style="display:none;">

            <div class="release-version">
                <h2 id="version">v0.0.0</h2>
                <span class="badge">Latest</span>
            </div>

            <p id="published" class="info"></p>

            <a id="mainDownload"
               href="#"
               class="download-btn">
                Download Latest Release
            </a>

            <div id="assets" class="asset-list"></div>

        </div>

    </div>

</div>

<script>

// Replace with your repositoryhttps://github.com/data070508/main/releases/download/v1/Daily.expenditure.xlsx
const owner = "data070508";
const repo = "main";

const api =
`https://api.github.com/repos/${owner}/${repo}/releases/latest`;

async function loadRelease() {

    try {

        const response = await fetch(api);

        if(!response.ok){
            throw new Error("Failed to load release");
        }

        const release = await response.json();

        document.getElementById("version").textContent =
            release.tag_name;

        document.getElementById("published").textContent =
            "Published: " +
            new Date(release.published_at)
            .toLocaleDateString();

        const assetsContainer =
            document.getElementById("assets");

        assetsContainer.innerHTML = "";

        if(release.assets.length > 0){

            document.getElementById("mainDownload")
                .href =
                release.assets[0].browser_download_url;

            release.assets.forEach(asset => {

                const item =
                document.createElement("div");

                item.className = "asset";

                item.innerHTML = `
                    <span>${asset.name}</span>
                    <a href="${asset.browser_download_url}"
                       target="_blank">
                       Download
                    </a>
                `;

                assetsContainer.appendChild(item);

            });

        } else {

            document.getElementById("mainDownload")
                .href =
                release.html_url;

        }

        document.getElementById("loading")
            .style.display = "none";

        document.getElementById("releaseData")
            .style.display = "block";

    } catch(error){

        document.getElementById("loading").innerHTML =
            "Unable to load release data.";

        console.error(error);
    }
}

loadRelease();

</script>

</body>
</html>
